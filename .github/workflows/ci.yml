name: AllpaNina CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: frontend
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            echo "Missing frontend/package-lock.json. Commit the lockfile for reproducible CI."
            exit 1
          fi

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend and scientific delivery contract
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  scientific:
    name: Scientific Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: python -m pip install -r requirements.txt
      - name: Run real scientific tests (missing tests fail)
        run: python -m pytest tests/ -q
      - name: Check backend syntax
        run: python -m compileall -q backend/app

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check backend setup
        id: detect
        shell: bash
        run: |
          if [[ -f backend/requirements.txt ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Backend not initialized yet; skipping checks."
          fi

      - name: Set up Python
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.detect.outputs.exists == 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Check Python syntax
        if: steps.detect.outputs.exists == 'true'
        run: python -m compileall -q backend/app

      - name: Run backend tests
        if: steps.detect.outputs.exists == 'true'
        shell: bash
        run: |
          if [[ -d backend/tests ]] && find backend/tests -type f -name 'test_*.py' | grep -q .; then
            python -m pytest backend/tests -q
          else
            echo "No backend tests found yet; skipping pytest."
          fi

  data:
    name: Data pipeline tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q scripts tests

      - name: Run data tests
        run: python -m pytest tests -q
