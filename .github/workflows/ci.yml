name: AllpaNina CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: frontend
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            echo "Missing frontend/package-lock.json. Commit the lockfile for reproducible CI."
            exit 1
          fi

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend and scientific delivery contract
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  scientific:
    name: Scientific Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: python -m pip install -r requirements.txt
      - name: Run real scientific tests (missing tests fail)
        run: python -m pytest tests/ -q
      - name: Check backend syntax
        run: python -m compileall -q backend/app
